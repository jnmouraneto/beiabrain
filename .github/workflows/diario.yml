name: Rotina diaria

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasilia (UTC-3)
  workflow_dispatch:
    inputs:
      dias_vendas:
        description: "Janela de vendas em dias (use 90 na carga inicial)"
        default: "2"

permissions:
  contents: write

concurrency:
  group: rotina-diaria
  cancel-in-progress: false

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
      BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
      BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # 1) Trabalho braçal, sem IA
      - name: Puxar dados do Bling
        run: python scripts/puxar_bling.py --dias "${{ github.event.inputs.dias_vendas || '2' }}"

      # O Bling rotaciona o refresh token a cada uso: sem salvar o novo, a proxima execucao falha.
      # GH_PAT_SECRETS = token pessoal (fine-grained) com permissao "Secrets: read and write" neste repo.
      - name: Atualizar refresh token no secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          python - <<'EOF' > /tmp/refresh.txt
          import json; print(json.load(open("dados/.bling_token.json"))["refresh_token"], end="")
          EOF
          gh secret set BLING_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/refresh.txt
          rm -f /tmp/refresh.txt

      - name: Gerar diff e indicadores
        run: python scripts/gerar_diff.py

      - name: Verificar demandas
        run: python scripts/verificar_demandas.py

      # 2) Inteligencia: o orquestrador le so o resumo (poucos KB)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Orquestrador (modo headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Execute a rotina diaria descrita no CLAUDE.md para a data de hoje. Gere o relatorio em relatorios/ e registre as novas demandas." \
            --allowedTools "Read,Write,Edit,Task,Bash(python scripts/adicionar_demanda.py:*),Bash(python scripts/consulta.py:*),Bash(python scripts/verificar_demandas.py:*)" \
            --max-turns 40

      - name: Commit dos resultados
        run: |
          git config user.name "rotina-diaria"
          git config user.email "rotina-diaria@users.noreply.github.com"
          git add dados/empresa.db dados/diario demandas memoria relatorios
          git diff --cached --quiet && echo "Nada a commitar" || git commit -m "Rotina diaria $(date +%F)"
          git push
